# Registro ativo padrão. É compatível com o layout local datasets/<dataset>/.
# Para usar cópias externas, informe --registry com outro YAML.
datasets:
  mnist:
    adapter: mnist
    root: ../datasets/mnist
  fashion_mnist:
    adapter: fashion_mnist
    root: ../datasets/fashion_mnist
  kmnist:
    adapter: kmnist
    root: ../datasets/kmnist
  emnist_balanced:
    adapter: emnist_balanced
    root: ../datasets/emnist_balanced
  cifar10:
    adapter: cifar10
    root: ../datasets/cifar10
  cifar100_coarse:
    adapter: cifar100_coarse
    root: ../datasets/cifar100_coarse
  svhn:
    adapter: svhn
    root: ../datasets/svhn
  gtsrb:
    adapter: gtsrb
    root: ../datasets/gtsrb
  fer2013:
    adapter: fer2013
    root: ../datasets/fer2013
