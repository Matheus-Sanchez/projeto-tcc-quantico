[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-benchmark"
version = "0.1.0"
description = "Pipeline reproduzível para preparação de dados e classificadores clássicos do TCC."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.0.2",
  "Pillow==11.1.0",
  "PyYAML==6.0.2",
  "scipy==1.15.2",
]

[project.optional-dependencies]
classical = ["tensorflow==2.21.0"]
dev = ["pytest>=8,<9"]

[project.scripts]
tcc-benchmark = "utils.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["classic_models*", "data_prep*", "logs*", "metrics*", "utils*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
